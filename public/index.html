<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лесные пожары — карта мира</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#1d2733; --ink-soft:#5b6878; --panel:rgba(255,255,255,.95); --line:#d9dee5; --chip:#eef1f5;
          --fire:#e8180c; --fire-hot:#9e0000; --focus:#1f6feb; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8edf2; --ink-soft:#9aa6b4; --panel:rgba(24,30,38,.94); --line:#33404e; --chip:#2a3440; --focus:#6ea8ff; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:#e6e6e6; }
  @media (prefers-color-scheme: dark) { body, .leaflet-container { background:#1c1f23; } }
  #map { position:fixed; inset:0; }
  .fire-canvas { position:absolute; inset:0; z-index:450; pointer-events:none; }
  .leaflet-tile-pane { filter:grayscale(1) brightness(1.04) contrast(.92); }
  @media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter:grayscale(1) invert(1) brightness(.82) contrast(.9); } }
  .panel { position:fixed; z-index:1000; top:calc(12px + env(safe-area-inset-top,0px)); left:12px;
    width:min(330px, calc(100vw - 24px)); padding:16px 18px; border-radius:14px;
    background:var(--panel); backdrop-filter:blur(6px); box-shadow:0 6px 24px rgba(10,20,30,.18); }
  h1 { margin:0; font-size:1.15rem; font-weight:700; letter-spacing:-.01em; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:12px; padding:3px; border-radius:10px; background:var(--chip); }
  .tabs button { border:0; padding:6px; border-radius:8px; background:transparent; font-weight:500; color:var(--ink-soft); }
  .tabs button[aria-pressed="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .tabs button:disabled { opacity:.45; cursor:not-allowed; }
  .count { margin:14px 0 2px; font-size:2.1rem; font-weight:700; line-height:1; color:var(--fire); font-variant-numeric:tabular-nums; }
  .sub { margin:0; font-size:.82rem; color:var(--ink-soft); }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .controls[hidden] { display:none; }
  label { display:grid; gap:4px; font-size:.78rem; color:var(--ink-soft); }
  select, input, button { font:inherit; font-size:.88rem; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px 8px; }
  .wide { grid-column:1 / -1; }
  button { cursor:pointer; font-weight:500; }
  .primary { background:var(--fire); border-color:var(--fire); color:#fff; }
  button:disabled { opacity:.55; cursor:progress; }
  select:focus-visible, input:focus-visible, button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .legend { display:flex; gap:14px; margin-top:14px; font-size:.78rem; color:var(--ink-soft); flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { display:inline-block; border-radius:50%; background:var(--fire); box-shadow:0 0 0 3px rgba(232,24,12,.22); }
  .status { margin-top:10px; font-size:.78rem; color:var(--ink-soft); min-height:1em; }
  .status.err { color:var(--fire); }
  .fire-tip { position:absolute; z-index:900; padding:10px 12px; border-radius:10px; background:var(--panel); color:var(--ink); font-size:.85rem; line-height:1.45; box-shadow:0 4px 16px rgba(0,0,0,.25); pointer-events:auto; }
  .fire-tip[hidden] { display:none; }
  @media (max-width:520px) { .panel { padding:12px 14px; } .count { font-size:1.7rem; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Карта лесных пожаров"></div>

<section class="panel">
  <h1>Лесные пожары на карте мира</h1>
  <div class="tabs" role="group" aria-label="Режим">
    <button type="button" id="tabLive" aria-pressed="true">Сейчас</button>
    <button type="button" id="tabArch" aria-pressed="false">Архив</button>
  </div>

  <p class="count" id="count" aria-live="polite">—</p>
  <p class="sub" id="sub">очагов по данным спутников NASA</p>

  <div class="controls" id="liveCtl">
    <label>Спутник
      <select id="sat">
        <option value="viirs_snpp">VIIRS Suomi NPP</option>
        <option value="viirs_noaa20">VIIRS NOAA-20</option>
        <option value="viirs_noaa21">VIIRS NOAA-21</option>
        <option value="modis">MODIS</option>
      </select>
    </label>
    <label>Период
      <select id="period">
        <option value="24h">24 часа</option>
        <option value="48h">48 часов</option>
        <option value="7d">7 дней</option>
      </select>
    </label>
    <button type="button" class="wide" id="refresh">Обновить</button>
  </div>

  <div class="controls" id="archCtl" hidden>
    <label>Спутник
      <select id="aSat">
        <option value="modis">MODIS (с 2000)</option>
        <option value="viirs_snpp">VIIRS Suomi NPP (с 2012)</option>
        <option value="viirs_noaa20">VIIRS NOAA-20 (с 2018)</option>
      </select>
    </label>
    <label>Дней подряд
      <select id="aDays"><option>1</option><option>2</option><option>3</option><option>5</option></select>
    </label>
    <label class="wide">Дата начала
      <input type="date" id="aDate" min="2000-11-01">
    </label>
    <button type="button" class="wide primary" id="show">Показать пожары</button>
  </div>

  <div class="legend" aria-label="Мощность пожара">
    <span><i class="dot" style="width:6px;height:6px;opacity:.8"></i>до 10 МВт</span>
    <span><i class="dot" style="width:9px;height:9px"></i>10–100</span>
    <span><i class="dot" style="width:13px;height:13px;background:var(--fire-hot)"></i>100+</span>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const nf = new Intl.NumberFormat("ru-RU");

const map = L.map("map", { worldCopyJump:true, minZoom:2, zoomControl:false }).setView([20, 10], 2);
L.control.zoom({ position:"bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Пожары: <a href="https://firms.modaps.eosdis.nasa.gov/">NASA FIRMS</a>',
  maxZoom:18,
}).addTo(map);

// Все точки рисуются на одном canvas поверх карты — выдерживает сотни тысяч очагов
const FireLayer = L.Layer.extend({
  initialize() { this.rows = []; this._raf = 0; },
  onAdd(m) {
    this._c = L.DomUtil.create("canvas", "fire-canvas", m.getContainer());
    m.on("move zoomend resize viewreset", this.schedule, this);
    m.on("zoomanim", this.hide, this);
    this.draw();
  },
  onRemove(m) { L.DomUtil.remove(this._c); m.off("move zoomend resize viewreset", this.schedule, this); m.off("zoomanim", this.hide, this); },
  hide() { this._c.style.opacity = 0; },
  schedule() { if (!this._raf) this._raf = requestAnimationFrame(() => { this._raf = 0; this.draw(); }); },
  setData(rows) { this.rows = rows.slice().sort((a, b) => a[2] - b[2]); this.draw(); },
  radius(frp, z) { const b = Math.max(1.8, z * 0.8); return frp >= 100 ? b * 2.1 : frp >= 10 ? b * 1.45 : b; },
  draw() {
    const m = this._map; if (!m) return;
    const size = m.getSize(), dpr = window.devicePixelRatio || 1, c = this._c;
    if (c.width !== size.x * dpr || c.height !== size.y * dpr) {
      c.width = size.x * dpr; c.height = size.y * dpr; c.style.width = size.x + "px"; c.style.height = size.y + "px";
    }
    const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, size.x, size.y);
    c.style.opacity = 1;
    const z = m.getZoom(), b = m.getBounds().pad(0.05), W = b.getWest(), E = b.getEast(), S = b.getSouth(), N = b.getNorth();
    const shifts = [-360, 0, 360].filter(s => E > -180 + s && W < 180 + s);
    const halo = new Path2D(), low = new Path2D(), mid = new Path2D(), hot = new Path2D();
    for (const r of this.rows) {
      if (r[0] < S || r[0] > N) continue;
      for (const s of shifts) {
        const lon = r[1] + s; if (lon < W || lon > E) continue;
        const p = m.latLngToContainerPoint([r[0], lon]), rad = this.radius(r[2], z);
        halo.moveTo(p.x + rad * 2.2, p.y); halo.arc(p.x, p.y, rad * 2.2, 0, 6.2832);
        const t = r[2] >= 100 ? hot : r[2] >= 10 ? mid : low;
        t.moveTo(p.x + rad, p.y); t.arc(p.x, p.y, rad, 0, 6.2832);
      }
    }
    ctx.fillStyle = "rgba(232,24,12,.18)"; ctx.fill(halo);
    ctx.fillStyle = "#ff4a2e"; ctx.fill(low);
    ctx.fillStyle = "#e8180c"; ctx.fill(mid);
    ctx.fillStyle = "#9e0000"; ctx.fill(hot);
  },
  nearest(ll) {
    const m = this._map, cp = m.latLngToContainerPoint(ll), z = m.getZoom(), b = m.getBounds();
    let best = null, bestD = Infinity;
    for (const r of this.rows) {
      if (r[0] < b.getSouth() || r[0] > b.getNorth()) continue;
      for (const s of [-360, 0, 360]) {
        const p = m.latLngToContainerPoint([r[0], r[1] + s]), d = Math.hypot(p.x - cp.x, p.y - cp.y);
        if (d < bestD && d <= this.radius(r[2], z) + 6) { bestD = d; best = r; }
      }
    }
    return best;
  },
});
const fires = new FireLayer().addTo(map);

const CONF = { l:"низкая", n:"средняя", h:"высокая" };
const tip = L.DomUtil.create("div", "fire-tip", map.getContainer());
tip.hidden = true;
L.DomEvent.disableClickPropagation(tip);
map.on("movestart zoomstart", () => tip.hidden = true);
map.on("click", e => {
  const r = fires.nearest(e.latlng);
  if (!r) { tip.hidden = true; return; }
  const conf = CONF[r[3]] || (r[3] !== "" ? r[3] + "%" : "—");
  tip.innerHTML = `<b>Очаг пожара</b><br>${r[4]}, ${r[5].slice(0,2)}:${r[5].slice(2)} UTC<br>` +
    `Мощность: ${r[2].toFixed(1)} МВт<br>Достоверность: ${conf}<br>` +
    `${r[6] === "N" ? "Ночной" : "Дневной"} снимок<br>${r[0].toFixed(3)}, ${r[1].toFixed(3)}`;
  const p = e.containerPoint, sz = map.getSize();
  tip.hidden = false;
  tip.style.left = Math.min(p.x + 12, sz.x - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(8, Math.min(p.y + 12, sz.y - tip.offsetHeight - 8)) + "px";
});

let mode = "live", liveTimer = null, busy = false;
function setStatus(t, err) { $("status").textContent = t; $("status").className = err ? "status err" : "status"; }
function lockButtons(v) { busy = v; ["refresh", "show"].forEach(id => $(id).disabled = v); }

async function getJson(url) {
  const res = await fetch(url);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "сервер ответил " + res.status);
  return data;
}

async function loadLive() {
  if (busy) return; lockButtons(true); setStatus("Загружаю свежие данные спутников…");
  try {
    const d = await getJson(`/api/fires?sat=${$("sat").value}&period=${$("period").value}`);
    if (mode !== "live") return;
    fires.setData(d.rows);
    $("count").textContent = nf.format(d.count);
    $("sub").textContent = `очагов за ${$("period").selectedOptions[0].text}`;
    setStatus("Обновлено в " + new Date(d.updated).toLocaleTimeString("ru-RU", { hour:"2-digit", minute:"2-digit" }) + ", автообновление каждые 15 мин");
  } catch (e) { setStatus("Данные не загрузились: " + e.message, true); }
  finally { lockButtons(false); }
}

async function loadArchive() {
  const date = $("aDate").value;
  if (!date) { setStatus("Выберите дату", true); return; }
  if (busy) return; lockButtons(true); setStatus("Загружаю архив NASA, это может занять до минуты…");
  try {
    const d = await getJson(`/api/archive?sat=${$("aSat").value}&date=${date}&days=${$("aDays").value}`);
    fires.setData(d.rows);
    $("count").textContent = nf.format(d.count);
    const days = Number($("aDays").value);
    $("sub").textContent = `очагов ${days === 1 ? "за " + fmtDate(date) : "с " + fmtDate(date) + ", " + days + " дн."}`;
    setStatus(d.count ? "Источник: " + d.source : "За эти даты данных нет — выберите другую дату или спутник");
  } catch (e) { setStatus("Архив не загрузился: " + e.message, true); }
  finally { lockButtons(false); }
}
const fmtDate = s => new Date(s + "T00:00:00Z").toLocaleDateString("ru-RU", { day:"numeric", month:"long", year:"numeric", timeZone:"UTC" });

function setMode(m) {
  mode = m;
  $("tabLive").setAttribute("aria-pressed", m === "live"); $("tabArch").setAttribute("aria-pressed", m === "archive");
  $("liveCtl").hidden = m !== "live"; $("archCtl").hidden = m !== "archive";
  clearInterval(liveTimer);
  fires.setData([]); $("count").textContent = "—"; setStatus("");
  if (m === "live") { loadLive(); liveTimer = setInterval(loadLive, 15 * 60 * 1000); }
  else { $("sub").textContent = "выберите дату и нажмите «Показать пожары»"; }
}

// VIIRS за 7 дней — сотни тысяч точек; оставляем 7 дней только для MODIS
function syncPeriod() {
  const viirs = $("sat").value !== "modis", opt = $("period").querySelector('[value="7d"]');
  opt.disabled = viirs; if (viirs && $("period").value === "7d") $("period").value = "48h";
}
const MIN = { modis:"2000-11-01", viirs_snpp:"2012-01-20", viirs_noaa20:"2018-04-01" };
function syncDateMin() { $("aDate").min = MIN[$("aSat").value]; }

$("tabLive").onclick = () => setMode("live");
$("tabArch").onclick = () => setMode("archive");
$("refresh").onclick = loadLive;
$("sat").onchange = () => { syncPeriod(); loadLive(); };
$("period").onchange = loadLive;
$("aSat").onchange = syncDateMin;
$("show").onclick = loadArchive;

const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
$("aDate").max = yesterday; $("aDate").value = "2023-08-15";
syncPeriod(); syncDateMin();

getJson("/api/config").then(c => {
  if (!c.archive) { $("tabArch").disabled = true; $("tabArch").title = "Архив включается ключом FIRMS_MAP_KEY на сервере"; }
}).catch(() => {});
setMode("live");
</script>
</body>
</html>
